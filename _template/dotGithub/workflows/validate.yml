name: "Validate"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch: # allows manual build; the standard dispatch inputs, read by name by the workflow
    inputs:
      environment:
        description: "Environment to run, as named in environments-yml. Empty runs every environment."
        type: string
        default: ""
      goal:
        description: "Goal for this run. default follows goals-yml; plan, apply and destroy-plan override it for the selected environments."
        type: choice
        options: [default, plan, apply, destroy-plan]
        default: default
      reason:
        description: "Why this run is dispatched. Recorded in the run summary."
        type: string
        default: ""

jobs:
  tf:
    uses: dsb-norge/github-actions-terraform/.github/workflows/terraform-ci-cd-default.yml@v1
    secrets: inherit # pass all secrets, ok since we trust our own workflow
    permissions: write-all # allow all, ok since we trust our own workflow
    with:
      terraform-version: "latest" # full version string ex. 'v0.48.0', semver og 'latest'
      tflint-version: "latest" # full version string ex. 'v0.48.0' or 'latest', does not support wildcards/patterns
      # all init commands should be performed without backend
      extra-envs-yml: |
        TF_CLI_ARGS_init: "-backend=false"
      # required by tflint
      terraform-init-additional-dirs-yml: |
        - "./main"
      # only validate + lint, project must be applied manually
      goals-yml: |
        - init
        - format
        - validate
        - lint
      environments-yml: |
